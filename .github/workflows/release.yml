name: Signed APK release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FIRESPOT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/firespot-release.p12"
          chmod 600 "$RUNNER_TEMP/firespot-release.p12"
      - name: Build pinned demo core
        run: ./scripts/build_gameboy.sh
      - name: Build signed releases, lint, test and verify
        env:
          FIRESPOT_KEYSTORE: ${{ runner.temp }}/firespot-release.p12
          FIRESPOT_STORE_PASSWORD: ${{ secrets.FIRESPOT_STORE_PASSWORD }}
          FIRESPOT_KEY_PASSWORD: ${{ secrets.FIRESPOT_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleStandardRelease :app:assembleDemoRelease :app:lintStandardRelease :app:lintDemoRelease :app:testStandardReleaseUnitTest -PincludeX86=true --max-workers=2
          python3 scripts/verify_artifacts.py --apk app/build/outputs/apk/standard/release/app-standard-release.apk
          python3 scripts/verify_artifacts.py --apk app/build/outputs/apk/demo/release/app-demo-release.apk --demo
      - name: Stage reproducible release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/firespot-standard.apk
          cp app/build/outputs/apk/demo/release/app-demo-release.apk dist/firespot-demo.apk
          git archive --format=tar.gz --prefix=firespot/ HEAD > dist/firespot-source.tar.gz
          cp artifacts/gameboy/gambatte-source.tar.gz artifacts/gameboy/COPYING dist/
          cp LICENSE NOTICE dist/
          cd dist
          sha256sum *.apk *.tar.gz LICENSE NOTICE COPYING > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-firespot-release
          path: dist/
      - name: Publish versioned APK release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "FireSpot $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/firespot-release.p12"
