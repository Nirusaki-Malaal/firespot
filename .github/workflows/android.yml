name: Android CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358'
      - name: Build pinned Game Boy support
        run: ./scripts/build_gameboy.sh
      - name: Build, lint and test both distributions
        run: ./gradlew :app:assembleDemoDebug :app:assembleStandardDebug :app:lintDemoDebug :app:lintStandardDebug :app:testStandardDebugUnitTest -PincludeX86=true --max-workers=2
      - name: Verify packaging and failure paths
        run: |
          python3 scripts/verify_artifacts.py --apk app/build/outputs/apk/standard/debug/app-standard-debug.apk --cores artifacts/gameboy
          python3 scripts/verify_artifacts.py --apk app/build/outputs/apk/demo/debug/app-demo-debug.apk --demo
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test real video, input, audio, scoring and save restoration
        run: |
          make -C .tooling/gambatte/source -f Makefile.libretro platform=unix -j2
          python3 tests/core_smoke.py .tooling/gambatte/source/gambatte_libretro.so app/src/debug/assets/firespot-signal.gb
          python3 tests/core_smoke.py .tooling/gambatte/source/gambatte_libretro.so app/src/main/assets/starter/orbit-collector.gb 1
          python3 tests/core_smoke.py .tooling/gambatte/source/gambatte_libretro.so app/src/main/assets/starter/pocket-courier.gb 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firespot-ci
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/reports/
            app/build/test-results/
            artifacts/gameboy/
